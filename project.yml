name: MyPass
options:
  bundleIdPrefix: com.mypass
packages:
  MyPassKit:
    path: Packages/MyPassKit
  SyncKit:
    path: Packages/SyncKit
  ExtensionBridgeKit:
    path: Packages/ExtensionBridgeKit
targets:
  MyPass:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MyPass
    dependencies:
      - package: MyPassKit
      - package: SyncKit
      - package: ExtensionBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mypass.app
        CODE_SIGN_ENTITLEMENTS: MyPass/MyPass.entitlements
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MyPass/Info.plist
      properties:
        NSFaceIDUsageDescription: "MyPass uses Touch ID to quickly unlock your password vault."
        LSApplicationCategoryType: public.app-category.utilities
  ChromeHost:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ChromeHost
    dependencies:
      - package: ExtensionBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mypass.chromehost
        CODE_SIGN_ENTITLEMENTS: ChromeHost/ChromeHost.entitlements
        MARKETING_VERSION: "0.1.0"
  MyPassTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MyPassTests
    dependencies:
      - target: MyPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
