name: MyPass
options:
  bundleIdPrefix: com.mypass
  developmentLanguage: en
# A stable signing identity is required, not a convenience. Ad-hoc signing gives every
# rebuild a fresh cdhash, and the login-keychain ACL guarding the biometric unlock key
# is bound to exactly that hash — so each build made macOS prompt for the keychain
# password again. See BiometricKeyStore.swift.
settings:
  base:
    DEVELOPMENT_TEAM: W645B93PPQ
    CODE_SIGN_STYLE: Automatic
packages:
  MyPassKit:
    path: Packages/MyPassKit
  SyncKit:
    path: Packages/SyncKit
  ExtensionBridgeKit:
    path: Packages/ExtensionBridgeKit
targets:
  MyPass:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MyPass
    dependencies:
      - package: MyPassKit
      - package: SyncKit
      - package: ExtensionBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mypass.app
        CODE_SIGN_ENTITLEMENTS: MyPass/MyPass.entitlements
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Localization is driven by the string catalogs under MyPass/Resources
        # (Localizable.xcstrings, InfoPlist.xcstrings): emit per-language .lproj
        # resources from them and prefer catalogs over legacy .strings files.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: MyPass/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "MyPass uses Touch ID to quickly unlock your password vault."
        LSApplicationCategoryType: public.app-category.utilities
        # Declares the languages the app ships so the system picks uk/ru for matching users.
        # NSFaceIDUsageDescription above stays the English source string;
        # InfoPlist.xcstrings localizes it.
        CFBundleLocalizations: [en, uk, ru]
  ChromeHost:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ChromeHost
    dependencies:
      - package: ExtensionBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mypass.chromehost
        CODE_SIGN_ENTITLEMENTS: ChromeHost/ChromeHost.entitlements
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "2"
  MyPassTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MyPassTests
    dependencies:
      - target: MyPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
