name: CodeQL

# GitHub code scanning, advanced setup (code scanning default setup stays "not-configured" so
# the two never run side by side). The languages and what each one analyzes:
#   actions                 .github/workflows/*.yml
#   javascript-typescript   ChromeExtension/ (vendor/ is excluded in .github/codeql/codeql-config.yml)
#   swift                   MyPass, ChromeHost and the library targets of the three local Swift
#                           packages, extracted from the same unsigned build a developer runs:
#                           scripts/dev.sh build --unsigned. Only what that build compiles is
#                           analyzed, so the test targets (MyPassTests, Packages/*/Tests) are not.
# The vendored C code (CArgon2) is not analyzed on purpose.
#
# Which legs run on a pull request: only "actions" and "javascript-typescript". The Swift leg is
# left out of the matrix on pull_request (see strategy.matrix.language below) and runs on a push
# to master, on the weekly schedule and on manual dispatch. Why: the Swift leg is a full traced build of the app
# on an arm64 runner whose tracer runs through Rosetta 2, about 30 minutes, and as a required
# check it held up every pull request, including the ones that never touch Swift. Its findings
# still reach the Security tab (code scanning alerts) after the merge and every week, just not
# before it. The other two legs take about a minute each, so they keep running on every pull
# request and keep a CodeQL result present on every pull request head commit, which is what the
# `code_scanning` rule of the master ruleset looks for.
#
# Like ci.yml this uses the plain pull_request event (no pull_request_target) and no secrets, so a
# pull request from a fork runs with a read-only token and cannot reach anything privileged.
# GitHub documents that code scanning still accepts the SARIF upload when the run is triggered by
# the pull_request event, so a fork pull request (or Dependabot) gets its results with that token.
# A push to master by Dependabot (a squash-merge commit it authored) has no such exception and its
# upload can fail with "Resource not accessible by integration".
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Weekly, so alerts also appear when GitHub ships new queries without any code change.
  # A schedule only fires from the default branch.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer push cancels an in-progress pull request run; runs on master, the
# schedule and manual runs are never cancelled.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # The job name is what a branch protection rule or ruleset matches as a required status
    # check, exactly like "ci" in ci.yml. Only "Analyze (actions)" and
    # "Analyze (javascript-typescript)" are required; do not rename the job without updating
    # those rules. "Analyze (swift)" is deliberately NOT required and must not be added back:
    # on a pull request the matrix has no swift leg, so that check is never reported at all and a
    # required "Analyze (swift)" would stay pending forever, blocking the merge. (A job skipped
    # by its own `if` would not help either: GitHub reports it under the unexpanded name
    # "Analyze (${{ matrix.language }})", and the `matrix` context is not even available in
    # jobs.<id>.if, which actionlint confirms.)
    name: Analyze (${{ matrix.language }})
    # Everything that differs per language is derived from matrix.language in the expressions
    # below instead of an `include` list. The reason is the language list itself: it is the one
    # thing that has to depend on the event, and an `include` entry that matches no combination
    # is added as a new combination, so an include-based swift entry could not be dropped on
    # pull requests.
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      # Read the repository.
      contents: read
      # Upload the SARIF results to code scanning. This is the only write permission.
      security-events: write
      # `actions: read` (workflow run details) is only needed for private repositories; this
      # repository is public. Add it here if the repository ever becomes private.
    strategy:
      fail-fast: false
      matrix:
        # No swift on pull requests (reasoning in the header). `github` is an available context in
        # strategy, so this is decided when the matrix is expanded: on pull_request the run has
        # the actions and javascript-typescript legs only; on a push to master, the schedule and
        # workflow_dispatch it has all three.
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["actions","javascript-typescript"]' || '["actions","javascript-typescript","swift"]') }}
    env:
      # Empty for the non-Swift legs. Pinned for Swift so a runner image bump cannot change the
      # toolchain the extractor traces silently. macos-26 and the pinned Xcode match ci.yml (arm64,
      # Xcode 26.6). The CodeQL bundle pinned below (2.27.3) supports Swift 5.4 to 6.3 and
      # Xcode 26.6 ships Swift 6.3 (Apple's release notes), but the first run is the real check.
      # CodeQL does not support building with Xcode 27 selected on macOS 26 (a local Xcode 27 is
      # Swift 6.4), hence the pin. Apple Silicon support is a beta that needs Rosetta 2 while it
      # traces the build.
      DEVELOPER_DIR: ${{ matrix.language == 'swift' && '/Applications/Xcode_26.6.app' || '' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pinned Xcode
        if: matrix.language == 'swift'
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Installed Xcode versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          xcodebuild -version
          xcrun swift --version

      # CodeQL's build tracing runs x86-64 code, which an arm64 runner executes through
      # Rosetta 2. The runner image inventory does not list Rosetta, so verify it and install it
      # when it is missing instead of failing later inside the traced build.
      - name: Check Rosetta 2
        if: matrix.language == 'swift'
        run: |
          rosetta=/Library/Apple/usr/share/rosetta/rosetta
          if [[ ! -f "$rosetta" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          [[ -f "$rosetta" ]] || { echo "::error::Rosetta 2 is not installed."; exit 1; }
          echo "Rosetta 2 is available."

      - name: Install xcodegen
        if: matrix.language == 'swift'
        run: brew install xcodegen

      # Swift package SOURCES only (git checkouts and repository clones), never build products.
      # build/SourcePackages is the -clonedSourcePackagesDirPath of scripts/dev.sh and
      # scripts/test.sh; the objects live in build/<flavor>/ (DerivedData), which is deliberately
      # not cached here: CodeQL extracts Swift by tracing the real compiler calls, so a warm
      # build would skip compilation and silently shrink what is analyzed.
      # Measured on the first run: "Resolve Package Graph" plus the package fetch took about 15 of
      # the 36 minutes of the traced build (the resolve alone sat silent for 13.5 minutes under
      # the tracer), while the same step takes 35 seconds in ci.yml without it.
      # The key covers everything that decides which packages are fetched. dev.sh builds with
      # -onlyUsePackageVersionsFromResolvedFile, so a restored checkout can only be the pinned
      # revision and a stale or partial cache cannot move a dependency.
      - name: Cache Swift package sources
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: swiftpm-sources-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/*/Package.swift', 'Packages/*/Package.resolved') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # The Swift build is traced (manual); the other two languages need no build.
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL traces this build to extract Swift. It is the same unsigned Debug build as
      # `scripts/dev.sh build --unsigned` and `scripts/test.sh --ci` (xcodegen generate, then
      # MyPass and ChromeHost with CODE_SIGNING_ALLOWED=NO and no entitlements). No signing
      # identity and no provisioning profile are involved. The runner is fresh, so every file is
      # compiled and nothing is skipped as up to date.
      - name: Build for Swift extraction
        if: matrix.language == 'swift'
        run: ./scripts/dev.sh build --unsigned

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
