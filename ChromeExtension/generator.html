<!DOCTYPE html>
<html data-theme="system">
<head>
  <meta charset="utf-8">
  <title>Password generator</title>
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      position: relative;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--mp-text);
      background: var(--mp-bg);
      display: flex;
      flex-direction: column;
    }
    #generator-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #history-view {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      background: var(--mp-bg);
      transform: translateX(100%);
      transition: transform 0.24s ease;
    }
    body.show-history #history-view { transform: translateX(0); }
    @media (prefers-reduced-motion: reduce) {
      #history-view { transition: none; }
    }
    [hidden] { display: none !important; }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px 6px;
    }
    header h1 {
      flex: 1;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }
    .icon-close, .back-btn {
      border: 0;
      background: transparent;
      color: #8e8e93;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
    }
    main { flex: 1; overflow: auto; padding: 8px 18px 16px; }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn-copy, .btn-fill, .regen {
      box-sizing: border-box;
      height: var(--mp-control-height, 32px);
      border-radius: var(--mp-control-radius, 8px);
      font-family: inherit;
      font-size: var(--mp-control-font, 13px);
      font-weight: var(--mp-control-weight, 600);
      line-height: 1;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-copy, .regen {
      border: 1px solid var(--mp-line, #d2d2d7);
      background: var(--mp-fill, #f5f5f7);
      color: var(--mp-text, #1d1d1f);
    }
    .regen {
      width: var(--mp-control-height, 32px);
      padding: 0;
      border-radius: 50%;
      font-size: 16px;
    }
    .btn-fill {
      margin-left: auto;
      border: 0;
      background: var(--mp-blue, #007aff);
      color: #fff;
      max-width: 180px;
    }
    .btn-fill:disabled { opacity: 0.45; cursor: default; }
    .password-box {
      border: 1px solid #d8d8de;
      border-radius: 10px;
      min-height: 24px;
      padding: 12px 14px;
      font-size: 18px;
      line-height: 1.35;
      word-break: break-all;
    }
    .pw-digit { color: #007aff; }
    .pw-symbol { color: #e85d4c; }
    .pw-letter { color: var(--mp-text); }
    .strength {
      height: 4px;
      margin: 8px 0 4px;
      background: var(--mp-hairline);
      border-radius: 2px;
      overflow: hidden;
    }
    #strength-fill { height: 100%; width: 0; background: #e5484d; }
    .hint, .generator-error {
      margin: 8px 0 0;
      color: var(--mp-secondary);
      font-size: 13px;
      line-height: 1.35;
    }
    .generator-error { color: #d70015; }
    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      border-top: 1px solid var(--mp-hairline);
      margin-top: 8px;
      padding-top: 8px;
    }
    .option-row label, .option-label { font-size: 15px; }
    .type-wrap { position: relative; margin-left: auto; }
    #type-btn {
      box-sizing: border-box;
      height: var(--mp-control-height, 32px);
      border: 1px solid var(--mp-line, #d2d2d7);
      background: var(--mp-bg);
      border-radius: var(--mp-control-radius, 8px);
      font: inherit;
      font-size: var(--mp-control-font, 13px);
      font-weight: var(--mp-control-weight, 600);
      padding: 0 10px;
      cursor: pointer;
      min-width: 180px;
      text-align: left;
    }
    #type-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      z-index: 3;
      min-width: 230px;
      background: var(--mp-bg);
      border: 1px solid #e5e5e7;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 4px;
    }
    .type-option {
      display: flex;
      width: 100%;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 14px;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .type-option.selected::after {
      content: '✓';
      margin-left: auto;
      color: #007aff;
    }
    .type-option:hover { background: var(--mp-fill); }
    .slider-row input[type="range"] { flex: 1; margin-left: auto; }
    .slider-row input[type="number"] {
      width: 52px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      text-align: center;
      padding: 4px;
    }
    select#memorable-separator {
      margin-left: auto;
      border: 1px solid #d2d2d7;
      background: var(--mp-bg);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      padding: 4px 8px;
    }
    .switch { position: relative; width: 42px; height: 26px; margin-left: auto; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute;
      inset: 0;
      background: #e5e5ea;
      border-radius: 13px;
      cursor: pointer;
    }
    .track::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      top: 2px;
      left: 2px;
      background: var(--mp-bg);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .switch input:checked + .track { background: #34c759; }
    .switch input:checked + .track::after { transform: translateX(16px); }
    .history-link {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border: 0;
      border-top: 1px solid var(--mp-hairline);
      background: transparent;
      color: #8e8e93;
      font-size: 14px;
      padding: 14px 0;
      cursor: pointer;
      text-align: left;
    }
    .history-link .chevron { margin-left: auto; }
    #history-search {
      width: 100%;
      box-sizing: border-box;
      height: var(--mp-control-height, 32px);
      border: 1px solid var(--mp-line, #d2d2d7);
      border-radius: var(--mp-control-radius, 8px);
      font: inherit;
      font-size: var(--mp-control-font, 13px);
      padding: 0 12px;
      margin: 8px 0 12px;
    }
    .history-day {
      margin: 14px 0 8px;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 500;
    }
    .history-row {
      position: relative;
      border: 1px solid #e6e6eb;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .history-row:hover, .history-row.menu-open { background: var(--mp-hairline); }
    .history-top { display: flex; align-items: flex-start; gap: 8px; }
    .history-title {
      flex: 1;
      color: #5e4bdb;
      font-size: 14px;
      font-weight: 650;
      word-break: break-all;
    }
    .history-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
    }
    .history-row:hover .history-actions,
    .history-row:focus-within .history-actions,
    .history-row.menu-open .history-actions { opacity: 1; }
    .history-show, .history-menu-btn, .history-menu button {
      border: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }
    .history-show { font-weight: 700; font-size: 14px; color: var(--mp-text); }
    .history-menu-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #d8d8de;
      color: var(--mp-text);
    }
    .history-menu {
      position: absolute;
      right: 8px;
      top: 40px;
      z-index: 2;
      background: var(--mp-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      padding: 4px;
      min-width: 140px;
    }
    .history-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    .history-menu button:hover { background: var(--mp-fill); }
    .history-secret {
      margin-top: 4px;
      color: #8e8e93;
      font-size: 13px;
      letter-spacing: 0.12em;
    }
    .history-secret.is-revealed { letter-spacing: 0; word-break: break-all; }
    .history-empty { color: #8e8e93; font-size: 14px; }
  </style>
</head>
<body>
  <section id="generator-view">
    <header>
      <h1>Password generator</h1>
      <button id="close-btn" class="icon-close" type="button" aria-label="Close">×</button>
    </header>
    <main>
      <div class="actions">
        <button id="copy-btn" class="btn-copy" type="button">Copy</button>
        <button id="regenerate-btn" class="regen" type="button" aria-label="Regenerate">↻</button>
        <button id="autofill-btn" class="btn-fill" type="button">Autofill</button>
      </div>
      <div id="password-display" class="password-box" role="textbox" aria-readonly="true" aria-label="Password"></div>
      <div class="strength" aria-hidden="true"><div id="strength-fill"></div></div>
      <p id="generator-error" class="generator-error" hidden></p>
      <div class="option-row">
        <span class="option-label">Type</span>
        <div class="type-wrap">
          <button id="type-btn" type="button" aria-haspopup="listbox">Smart password</button>
          <div id="type-menu" hidden>
            <button class="type-option selected" type="button" data-type="smart">Smart password</button>
            <button class="type-option" type="button" data-type="random">Random password</button>
            <button class="type-option" type="button" data-type="memorable">Memorable password</button>
            <button class="type-option" type="button" data-type="pin">PIN</button>
          </div>
        </div>
      </div>
      <p id="smart-hint" class="hint" hidden></p>
      <div id="random-options" hidden>
        <div class="option-row slider-row">
          <label for="random-length">Characters</label>
          <input id="random-length" type="range" min="8" max="64" value="20">
          <input id="random-length-number" type="number" min="8" max="64" value="20" aria-label="Characters">
        </div>
        <div class="option-row">
          <span>Digits</span>
          <label class="switch"><input id="random-digits" type="checkbox" checked><span class="track"></span></label>
        </div>
        <div class="option-row">
          <span>Symbols</span>
          <label class="switch"><input id="random-symbols" type="checkbox" checked><span class="track"></span></label>
        </div>
      </div>
      <div id="memorable-options" hidden>
        <div class="option-row slider-row">
          <label for="memorable-words">Words</label>
          <input id="memorable-words" type="range" min="3" max="10" value="4">
          <input id="memorable-words-number" type="number" min="3" max="10" value="4" aria-label="Words">
        </div>
        <div class="option-row">
          <label for="memorable-separator">Separator</label>
          <select id="memorable-separator">
            <option value="hyphen">Hyphens</option>
            <option value="space">Spaces</option>
            <option value="period">Periods</option>
            <option value="comma">Commas</option>
            <option value="underscore">Underscores</option>
          </select>
        </div>
        <div class="option-row">
          <span>Capitalize</span>
          <label class="switch"><input id="memorable-capitalize" type="checkbox"><span class="track"></span></label>
        </div>
        <div class="option-row">
          <span>Full words</span>
          <label class="switch"><input id="memorable-full-words" type="checkbox" checked><span class="track"></span></label>
        </div>
      </div>
      <div id="pin-options" hidden>
        <div class="option-row slider-row">
          <label for="pin-length">Digits</label>
          <input id="pin-length" type="range" min="3" max="12" value="4">
          <input id="pin-length-number" type="number" min="3" max="12" value="4" aria-label="Digits">
        </div>
      </div>
      <div class="option-row">
        <span>Use by default for suggestions</span>
        <label class="switch"><input id="use-default" type="checkbox"><span class="track"></span></label>
      </div>
      <button id="history-link" class="history-link" type="button">
        <span aria-hidden="true">◷</span>
        Password generator history
        <span class="chevron" aria-hidden="true">›</span>
      </button>
    </main>
  </section>
  <section id="history-view" hidden>
    <header>
      <button id="history-back" class="back-btn" type="button" aria-label="Back">←</button>
      <h1>Generator history</h1>
    </header>
    <main>
      <input id="history-search" type="search" placeholder="Search history" autocomplete="off">
      <div id="history-list"></div>
    </main>
  </section>
  <script src="shared/appearance-settings.js"></script>
  <script src="shared/theme.js"></script>
  <script src="shared/password-generator.js"></script>
  <script src="generator.js"></script>
</body>
</html>
