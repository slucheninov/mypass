<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MyPass</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      margin: 0;
      padding: 18px 16px;
      box-sizing: border-box;
      color: #1d1d1f;
      background: #fff;
    }
    .brand-key {
      display: block;
      width: 32px;
      height: 32px;
      margin: 0 auto 12px;
    }
    .brand-key--leading {
      margin: 0 0 12px;
    }
    h1.panel-title {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    p.panel-helper {
      font-size: 13px;
      color: #6e6e73;
      margin: 0 0 12px;
      line-height: 1.35;
    }
    p.list-header {
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      margin: 0 0 8px;
    }
    .btn-primary,
    .btn-secondary {
      font-size: 13px;
      line-height: 1.2;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #007aff;
      color: #fff;
      border-color: #007aff;
    }
    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
      border-color: #d2d2d7;
      margin-left: 8px;
    }
    .btn-row {
      margin-top: 4px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li.credential-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px;
      border-radius: 8px;
      cursor: pointer;
    }
    li.credential-row:hover {
      background: #f5f5f7;
    }
    .letter-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .letter-avatar-letter {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }
    .credential-text {
      min-width: 0;
      flex: 1;
    }
    .credential-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }
    .credential-username {
      font-size: 12px;
      color: #6e6e73;
      line-height: 1.25;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .totp-circle {
      position: relative;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(127, 127, 127, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }
    .totp-circle .totp-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .totp-circle .totp-ring circle {
      transition: stroke-dashoffset 1s linear;
    }
    .totp-circle-label {
      position: relative;
      z-index: 1;
    }
    .totp-circle.revealed {
      border-color: rgba(80, 160, 255, 0.6);
    }
    .totp-circle.copied {
      font-size: 9px;
      border-color: rgba(60, 200, 120, 0.6);
    }
    #pairing-panel .panel-title {
      margin-bottom: 12px;
    }
    #code-entry {
      margin-top: 12px;
    }
    #code-hint {
      margin: 0 0 6px;
      font-size: 12px;
      color: #6e6e73;
    }
    #code-input {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    #pairing-error {
      color: #c00;
      font-size: 12px;
      margin: 8px 0 0;
    }
    #open-mypass-helper {
      margin: 8px 0 0;
      font-size: 12px;
      color: #6e6e73;
    }
    #add-totp-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e5e7;
    }
    #add-totp-hint {
      margin: 0 0 6px;
      font-size: 12px;
      color: #6e6e73;
    }
    #totp-paste-input {
      width: 100%;
      box-sizing: border-box;
      font-size: 13px;
      margin-bottom: 8px;
    }
    #add-totp-error {
      color: #c00;
      font-size: 12px;
      margin: 8px 0 0;
    }
    .passkey-summary {
      word-break: break-all;
    }
    #passkey-picker-list {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
    }
    #passkey-settings-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e5e7;
      font-size: 12px;
      color: #6e6e73;
    }
    #passkey-settings-footer label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .totp-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(80, 160, 255, 0.15);
      color: #3b82f6;
    }
    .passkey-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(52, 199, 89, 0.15);
      color: #248a3d;
    }
    p.passkey-detail {
      font-size: 11px;
      color: #86868b;
      margin: -6px 0 12px;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="panel-shell">
    <section id="locked-panel" hidden>
      <img class="brand-key" src="icons/icon32.png" width="32" height="32" alt="">
      <h1 class="panel-title" id="locked-title"></h1>
      <p class="panel-helper" id="locked-helper"></p>
      <button id="locked-unlock-btn" type="button" class="btn-primary" hidden>Unlock MyPass</button>
      <button id="locked-retry-btn" type="button" class="btn-secondary">Retry</button>
    </section>

    <section id="app-unavailable-panel" hidden>
      <img class="brand-key" src="icons/icon32.png" width="32" height="32" alt="">
      <p class="panel-helper" id="app-unavailable-status"></p>
      <div id="app-unavailable-actions">
        <button id="retry-btn" type="button" class="btn-primary">Retry</button>
        <button id="open-mypass-btn" type="button" class="btn-secondary">Open MyPass</button>
        <p id="open-mypass-helper" hidden></p>
      </div>
    </section>

    <section id="empty-panel" hidden>
      <h1 class="panel-title" id="empty-title"></h1>
    </section>

    <section id="list-panel" hidden>
      <p class="list-header" id="list-header"></p>
      <ul id="list"></ul>
    </section>

    <section id="pairing-panel" hidden>
      <h1 class="panel-title" id="pairing-title"></h1>
      <button id="connect-btn" type="button" class="btn-primary">Connect</button>
      <div id="code-entry" hidden>
        <p id="code-hint">Enter the code shown in MyPass</p>
        <input id="code-input" type="text" inputmode="numeric" maxlength="7" pattern="[0-9]{6}" />
        <button id="submit-code-btn" type="button" class="btn-primary">Submit</button>
      </div>
      <p id="pairing-error" hidden></p>
    </section>

    <!-- Every passkey confirm panel shows the relying-party ID and the origin the
         ceremony actually came from. That pairing is the phishing-resistance
         requirement from the design's Global Constraints, not decorative copy. -->
    <section id="passkey-save-panel" hidden>
      <h1 class="panel-title">Save passkey</h1>
      <p class="panel-helper passkey-summary" id="passkey-save-summary"></p>
      <p class="passkey-detail" id="passkey-save-detail"></p>
      <button id="passkey-save-btn" type="button" class="btn-primary">Save</button>
      <button id="passkey-cancel-btn" type="button" class="btn-secondary">Cancel</button>
    </section>

    <section id="passkey-replace-panel" hidden>
      <h1 class="panel-title">Replace passkey?</h1>
      <p class="panel-helper passkey-summary" id="passkey-replace-summary"></p>
      <p class="passkey-detail" id="passkey-replace-detail"></p>
      <p class="panel-helper">This entry already has a passkey. Replacing it means the old one stops working.</p>
      <button id="passkey-replace-btn" type="button" class="btn-primary">Replace</button>
      <button id="passkey-replace-cancel-btn" type="button" class="btn-secondary">Cancel</button>
    </section>

    <section id="passkey-use-panel" hidden>
      <h1 class="panel-title">Use passkey</h1>
      <p class="panel-helper passkey-summary" id="passkey-use-summary"></p>
      <p class="passkey-detail" id="passkey-use-detail"></p>
      <button id="passkey-approve-btn" type="button" class="btn-primary">Approve</button>
      <button id="passkey-use-cancel-btn" type="button" class="btn-secondary">Cancel</button>
    </section>

    <section id="passkey-picker-panel" hidden>
      <h1 class="panel-title">Choose an entry</h1>
      <p class="panel-helper passkey-summary" id="passkey-picker-summary"></p>
      <ul id="passkey-picker-list"></ul>
      <button id="passkey-picker-cancel-btn" type="button" class="btn-secondary">Cancel</button>
    </section>

    <div id="generate-password-section" hidden>
      <p id="generate-password-hint">This page has a new-password field</p>
      <button id="generate-password-btn" type="button" class="btn-primary">Generate password</button>
      <p id="generate-password-error" hidden></p>
    </div>

    <div id="add-totp-section" hidden>
      <p id="add-totp-hint">Paste otpauth:// URL or secret key</p>
      <input id="totp-paste-input" type="text" placeholder="Paste otpauth:// URL or secret key" />
      <button id="add-totp-btn" type="button" class="btn-primary">Add</button>
      <p id="add-totp-error" hidden></p>
    </div>

    <div id="passkey-settings-footer" hidden>
      <label for="passkey-proxy-toggle">
        <input type="checkbox" id="passkey-proxy-toggle">
        Use MyPass for Chrome passkeys
      </label>
    </div>
  </div>
  <script src="shared/entry-visuals.js"></script>
  <script src="popup.js"></script>
</body>
</html>
