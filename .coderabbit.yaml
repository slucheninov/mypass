# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for MyPass. Schema: https://coderabbit.ai/integrations/schema.v2.json
# Reference: https://docs.coderabbit.ai/reference/configuration
#
# What this file does and does not do:
#   * It only takes effect once the CodeRabbit GitHub App is installed on this repository.
#     The file alone never starts a reviewer.
#   * Merge blocking comes from two separate parts. (1) `reviews.auto_approvals.enabled` makes
#     CodeRabbit submit a GitHub "changes requested" review when a review leaves actionable
#     comments, and approve once the latest commit is reviewed and the threads are resolved.
#     (2) A GitHub ruleset or branch protection rule must make that review count: require at
#     least one approving review (CodeRabbit's approval counts as one), require conversation
#     resolution, and require the CodeRabbit check run from the CodeRabbit app. GitHub treats a
#     "changes requested" review as informational unless a rule requires pull requests, and
#     the check run only fails when a review errors out, never because it found something.
#     CodeRabbit never merges and never edits code on its own here.
#   * Review output is English (project convention; see AGENTS.md).

language: en-US
tone_instructions: >-
  Be direct and technical. Report only correctness, security and data-integrity problems
  with a concrete failure scenario. Skip style opinions.
early_access: false

reviews:
  # chill = balanced; nitpicks stay in the collapsed section and are not actionable, so they do
  # not trigger a changes-requested review. Do not switch to assertive: with the request-changes
  # workflow below, every actionable comment can hold a pull request.
  profile: chill

  # The request-changes workflow (official name: Automatic approvals). Off by default upstream.
  # `request_changes_workflow` is its deprecated alias; keep only this key, because two keys with
  # different values turn the feature off and raise a configuration error.
  auto_approvals:
    enabled: true
    # A solo owner must not be able to clear a blocking review by commenting
    # `@coderabbitai approve` on their own pull request. Threads still resolve and approval still
    # comes back automatically after a fix is pushed and reviewed.
    allow_author_approval: false
    # No max_merge_risk / max_security_risk on purpose. A configured risk limit withholds approval
    # whenever an assessment is missing, and security risk assessment needs the Advanced plan.

  # Publish the canonical "CodeRabbit" check run, and fail it when a review errors out instead of
  # leaving a merge gate looking green or absent after a failed run.
  review_progress: true
  fail_commit_status: true

  high_level_summary: true
  review_status: true
  review_details: false
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    # Default is 5. A pause would silence the review (and its check) on a long-lived branch while
    # it is still a required gate. 0 disables pausing.
    auto_pause_after_reviewed_commits: 0
    drafts: false
    # Intentionally no ignore_usernames (Dependabot included) and no ignore_title_keywords: a
    # skipped review would leave a required CodeRabbit gate without a result.

  # Everything under these globs is generated, binary or third-party. Security-relevant own code
  # and tests are deliberately NOT excluded: Packages/MyPassKit/Sources/MyPassKit,
  # Packages/*/Tests, MyPassTests and ChromeExtension/tests are all still reviewed.
  # THIRD_PARTY_NOTICES.md is also NOT excluded: the dependency path_instructions below ask the
  # reviewer to check that it changed together with a dependency, and an excluded file would
  # make that check impossible to evaluate.
  path_filters:
    - "!ChromeExtension/vendor/**"                     # vendored jsQR.js (minified)
    - "!Packages/MyPassKit/Sources/CArgon2/**"         # vendored phc-winner-argon2, see VENDORING.md
    - "!Packages/MyPassKit/Sources/MyPassKit/Resources/public_suffix_list.dat"  # upstream Public Suffix List snapshot
    - "!Packages/MyPassKit/Tests/MyPassKitTests/Fixtures/**"  # binary .kdbx fixtures
    - "!MyPass/Assets.xcassets/**"                     # app icons and brand images
    - "!ChromeExtension/icons/**"
    - "!ChromeExtension/tests/fixtures/*.png"
    - "!Packages/MyPassKit/Sources/MyPassKit/Resources/password-rules.json"  # generated by scripts/update-password-rules.sh

  path_instructions:
    - path: "MyPass/**/*.swift"
      instructions: |
        macOS app, Swift + SwiftUI, deployment target macOS 14.0. Review for correctness first.
        - Concurrency: UI state and ObservableObject mutations belong on the main actor; flag
          missing @MainActor, data races across Task boundaries, unbounded Task capture of self,
          and DispatchQueue/Task mixes that reorder work that must be ordered.
        - Flag secrets (master key, passwords, TOTP secrets, tokens, vault bytes) reaching logs,
          print, error descriptions, UserDefaults, pasteboard without expiry, or crash text.
        - Long explanatory comments record why a constraint exists. Do not ask to remove them.
        - Strings are English until Phase 7 localization.
    - path: "MyPass/Security/**"
      instructions: |
        Keychain and biometric key handling. BiometricKeyStore guards a Keychain access group
        behind LAContext. Flag any change that weakens the access control flags, drops the
        access group, stores key material outside the Keychain, falls back to a weaker path
        silently, or fails open when authentication is unavailable.
        project.yml pins a stable DEVELOPMENT_TEAM on purpose: ad-hoc signing changes the cdhash on
        every build and silently breaks the biometric key ACL. Flag any suggestion or change that
        moves signing to ad-hoc or removes the team pin.
    - path: "{MyPass/State/ExtensionBridge/**,Packages/ExtensionBridgeKit/**,ChromeHost/**}"
      instructions: |
        Browser bridge, three hops: Chrome native messaging -> ChromeHost -> TCP loopback on
        127.0.0.1 (OS-assigned port, LoopbackServer.swift). Everything here must fail closed.
        - Every request carries a per-launch token and an optional pairing token. Flag any path
          that serves vault data without validating both as required, compares tokens in a way
          that is not constant-time, or binds anything beyond loopback.
        - ExtensionBridgeMessages.swift has an exhaustive switch with no `default`. A new request
          case must be handled everywhere; flag any `default:` added to silence the compiler.
        - Pairing: 6-digit code, valid 120 seconds, per-browser and revocable. Flag reuse,
          missing expiry, missing attempt limits, or revocation that leaves a token usable.
        - The host answers app_not_running when no token exists. Flag error paths that leak
          state or degrade to an unauthenticated response.
        - Passkeys (PasskeyCeremony.swift): credentials live in KeePassXC-compatible KPEX_PASSKEY_*
          fields. Flag origin/RP-ID checks that can be bypassed, user-presence or verification
          skipped, or the app-side toggle being overridden by extension state.
    - path: "{MyPass/State/ExtensionBridge/ExtensionEntryMatcher.swift,Packages/MyPassKit/Sources/MyPassKit/PublicSuffixList.swift,ChromeExtension/shared/url-match.js,ChromeExtension/shared/page-identifier.js,ChromeExtension/shared/passkey-sites.js}"
      instructions: |
        Domain matching decides where credentials are offered. It must use the bundled Public
        Suffix List for registrable-domain comparison, never suffix or endsWith heuristics.
        Frame-level matching is hostname-only and save banners are top-frame only. Flag
        substring/endsWith/regex matching on hostnames, missing punycode and Unicode
        normalization, scheme downgrades (https credential offered on http), IP-address hosts
        treated as domains, and any change that widens which sites receive a fill.
    - path: "{MyPass/State/VaultSession.swift,MyPass/Storage/**,MyPass/App/SingleInstance/**,Packages/SyncKit/**}"
      instructions: |
        Vault persistence, sync and shutdown integrity. Losing or corrupting a vault is the worst
        outcome here.
        - Saves must be atomic and must never write a partially built or empty database over a
          good one. Flag non-atomic writes, ignored write errors, and persistence debounce that
          can drop the last edit on lock, quit or crash.
        - Sync is a three-way merge (MergeEngine, SyncCheckpointStore). Flag merges that can
          silently drop entries, attachments or history, ignore deletions incorrectly, or advance
          the checkpoint before the merged result is durably saved.
        - Quit goes through QuitFlushCoordinator: flush, or a Cancel / Quit Anyway prompt on a
          failed or timed-out save. Flag any path that quits with unsaved changes and no prompt.
        - Single instance: the guard fails closed. A peer that never answers or does not exit
          within 15 s makes the new launch fail; do not suggest force-killing a peer.
        - SFTP uses trust-on-first-use host keys. Flag anything that accepts a changed host key.
    - path: "Packages/MyPassKit/Sources/MyPassKit/**"
      instructions: |
        Hand-written KDBX4 engine (headers, VariantDictionary, HMAC block streams, AES-256-CBC and
        ChaCha20, header authentication, Argon2id/Argon2d). Flag any weakening of authentication
        or integrity checks (verify HMAC before decrypt or parse, constant-time comparison),
        unchecked length or count fields from untrusted files (overflow, huge allocation),
        key material not zeroed where the code already zeroes it, and any parameter accepted
        below what the KDBX format allows. Argon2 salt length and parallelism are intentionally
        not restricted beyond the format.
    - path: "ChromeExtension/**/*.js"
      instructions: |
        Plain JavaScript MV3 extension, no bundler, no build step, minimum Chrome 127.
        - content.js: the fill icon lives in a closed shadow root, defends against hostile page CSS
          with !important, gates actions on event.isTrusted, and never mutates the site's own
          <input> elements. Flag changes that break any of these, trust page-controlled data,
          or expose secrets to the page's JavaScript world.
        - background.js talks native messaging only; flag message handlers that accept messages
          from unexpected senders or origins without checking sender.id / sender.url / frame.
        - Flag eval, innerHTML with dynamic data, and console logging of credentials or TOTP seeds.
        - Do not review ChromeExtension/vendor (excluded).
    - path: "{**/Tests/**,MyPassTests/**,ChromeExtension/tests/**}"
      instructions: |
        Tests are security evidence for this repository. Flag tests that assert nothing
        meaningful, that pass without exercising the failure path (especially the fail-closed
        paths above), that depend on wall-clock timing without control, or that touch the
        network or the real Keychain unless gated by the existing opt-in env vars
        (MYPASS_KEYCHAIN_TESTS, MYPASS_SFTP_INTEGRATION_TESTS, MYPASS_ICLOUD_INTEGRATION_TESTS).
        ChromeExtension tests are plain node scripts with no framework.
    - path: "{scripts/**,.github/workflows/**}"
      instructions: |
        Shell scripts must stay `set -euo pipefail`, resolve the repo root themselves and
        preflight required commands. Workflows must keep least-privilege `permissions`, use no
        pull_request_target and no secrets for fork code, and pin third-party actions to a full
        commit SHA. Flag command or expression injection from untrusted context
        (github.event.* title, body, branch names) into run steps.
    - path: "{project.yml,**/Package.swift,**/Package.resolved,THIRD_PARTY_NOTICES.md,LICENSE}"
      instructions: |
        Any change that adds, removes or bumps a dependency, or re-vendors a file, must update
        THIRD_PARTY_NOTICES.md in the same change. Flag unpinned or floating dependency
        requirements, new network-facing dependencies, and signing or entitlement changes
        (the stable DEVELOPMENT_TEAM pin must stay).
    - path: "{README.md,CONTRIBUTING.md,SECURITY.md,docs/**,MyPass/**/Info.plist}"
      instructions: |
        Documentation is English. RUN.md is intentionally Ukrainian and must not be flagged or
        translated. docs/implementation/ROADMAP.md lists only unfinished work. Flag security
        claims that the code does not back up.

  # Pre-merge checks stay advisory; only actionable review findings hold a pull request. An
  # `error`-mode check would also withhold CodeRabbit's approval while the request-changes
  # workflow is on.
  pre_merge_checks:
    docstrings:
      mode: "off"           # no docstring convention in this repository
    title:
      mode: warning
      requirements: "Conventional Commits with a scope, lowercase imperative subject, no trailing period, e.g. fix(app): reset auto-lock idle timer"
    description:
      mode: warning
    issue_assessment:
      mode: warning

  # No autonomous changes. Every finishing touch that can push commits, open stacked pull
  # requests or edit the branch is disabled.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # Linters without a project config or without a matching language produce style noise, not
  # correctness findings. Secret, workflow and shell checks stay on.
  tools:
    swiftlint:
      enabled: false        # no .swiftlint.yml; the repo has no linter by design
    eslint:
      enabled: false        # no ESLint config; plain JavaScript without a toolchain
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  # filePatterns supplements the built-in guideline globs (which include AGENTS.md and CLAUDE.md);
  # it does not replace them, so those two files are still read as review criteria. They also hold
  # agent-orchestration rules that are irrelevant to code review; the architecture guidance that
  # matters for review lives in path_instructions above.
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled

code_generation:
  docstrings:
    language: en-US
